<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
<title id="title">StreamHub streaming architecture</title>
<desc id="desc">Structured and semi-structured sources flow through FastAPI ingestion into Redpanda Kafka topics, then Spark Structured Streaming writes Delta Lake Bronze, Silver, and Gold layers for analytics.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1720"/><stop offset="1" stop-color="#173b45"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#0f766e"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker></defs>
<rect width="1120" height="360" rx="20" fill="url(#bg)"/>
<text x="36" y="42" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#e2faff">STREAMHUB · REAL-TIME DATA PLATFORM</text>
<text x="36" y="65" font-family="Segoe UI,Arial" font-size="12" fill="#a5c9d0">Kafka-compatible ingestion → streaming compute → governed lakehouse → analytics</text>
<g font-family="Segoe UI,Arial" text-anchor="middle">
<rect x="28" y="112" width="145" height="94" rx="12" fill="#122b37" stroke="#3b8795"/><text x="100" y="144" font-size="15" font-weight="700" fill="#e6fbff">DATA SOURCES</text><text x="100" y="166" font-size="12" fill="#b8d8df">CSV · JSON · API</text><text x="100" y="184" font-size="12" fill="#b8d8df">Batch + events</text>
<rect x="218" y="112" width="145" height="94" rx="12" fill="url(#node)" stroke="#5eead4"/><text x="290" y="144" font-size="15" font-weight="700" fill="#ffffff">FASTAPI</text><text x="290" y="166" font-size="12" fill="#dcfffb">Upload + producer</text><text x="290" y="184" font-size="12" fill="#dcfffb">Schema checks · DLQ</text>
<rect x="408" y="112" width="145" height="94" rx="12" fill="url(#node)" stroke="#5eead4"/><text x="480" y="144" font-size="15" font-weight="700" fill="#ffffff">REDPANDA</text><text x="480" y="166" font-size="12" fill="#dcfffb">Kafka topics</text><text x="480" y="184" font-size="12" fill="#dcfffb">Partitions · offsets</text>
<rect x="598" y="112" width="145" height="94" rx="12" fill="#24314e" stroke="#818cf8"/><text x="670" y="144" font-size="15" font-weight="700" fill="#ffffff">SPARK</text><text x="670" y="166" font-size="12" fill="#e0e7ff">Structured Streaming</text><text x="670" y="184" font-size="12" fill="#e0e7ff">Parse · validate · dedupe</text>
<rect x="788" y="94" width="145" height="130" rx="12" fill="#183a30" stroke="#4ade80"/><text x="860" y="120" font-size="15" font-weight="700" fill="#f0fff4">DELTA LAKE</text><rect x="808" y="135" width="105" height="22" rx="5" fill="#854d0e"/><text x="860" y="150" font-size="11" font-weight="700" fill="#fff7ed">BRONZE · RAW</text><rect x="808" y="164" width="105" height="22" rx="5" fill="#475569"/><text x="860" y="179" font-size="11" font-weight="700" fill="#f8fafc">SILVER · CLEAN</text><rect x="808" y="193" width="105" height="22" rx="5" fill="#a16207"/><text x="860" y="208" font-size="11" font-weight="700" fill="#fffbeb">GOLD · CURATED</text>
<rect x="978" y="112" width="114" height="94" rx="12" fill="#39294d" stroke="#c084fc"/><text x="1035" y="144" font-size="15" font-weight="700" fill="#faf5ff">INSIGHTS</text><text x="1035" y="166" font-size="12" fill="#eadcff">SQL · BI</text><text x="1035" y="184" font-size="12" fill="#eadcff">Data products</text>
</g>
<g fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"><path d="M173 159 H210"/><path d="M363 159 H400"/><path d="M553 159 H590"/><path d="M743 159 H780"/><path d="M933 159 H970"/></g>
<rect x="218" y="258" width="715" height="54" rx="10" fill="#102a35" stroke="#32616b"/><text x="575" y="280" font-family="Segoe UI,Arial" font-size="13" font-weight="700" text-anchor="middle" fill="#d9faff">CONTROL &amp; OPERATIONS</text><text x="575" y="299" font-family="Segoe UI,Arial" font-size="12" text-anchor="middle" fill="#a5c9d0">PostgreSQL metadata · API keys · consumer groups · lag / health metrics · Unity Catalog checkpoints</text>
